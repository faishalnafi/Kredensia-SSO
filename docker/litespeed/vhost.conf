# ============================================================
# SSO Sekolah — LiteSpeed Virtual Host Configuration
# Besutan  : Faishal Nafi Network (https://faishalnafi.com)
# Versi    : v1.0.0 | Compatible: OpenLiteSpeed 1.7+ / LSWS 6+
#
# Cara Penggunaan (OpenLiteSpeed Web Admin):
#   1. Login ke OLS Admin Panel (http://server:7080)
#   2. Virtual Hosts → Add New Virtual Host
#   3. Salin isi konfigurasi ini atau gunakan sebagai referensi
#   4. Pastikan mod_rewrite aktif (sudah bawaan LiteSpeed)
#
# Catatan: .htaccess di public/ sudah otomatis dibaca oleh
# LiteSpeed tanpa konfigurasi tambahan karena kompatibel penuh
# dengan Apache mod_rewrite syntax.
# ============================================================

virtualHost your-sso-domain.com {
  vhRoot                  /var/www/html/
  configFile              $SERVER_ROOT/conf/vhosts/your-sso-domain.com/vhconf.conf
  allowSymbolLink         1
  enableScript            1
  restrained              1
  setUIDMode              0
}

