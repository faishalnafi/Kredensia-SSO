# ============================================================
# SSO Sekolah — Nginx Configuration (Production-Ready)
# Besutan  : Faishal Nafi Network (https://faishalnafi.com)
# Versi    : v1.0.0 | Compatible: Nginx 1.18+
# ============================================================

# Rate limiting zone — cegah brute-force login
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name your-sso-domain.com www.your-sso-domain.com;

    # Redirect semua HTTP ke HTTPS (aktifkan di produksi)
    # return 301 https://$host$request_uri;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # ── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip Compression ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ── Routing Utama ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Rate Limit: Halaman Login ─────────────────────────────
    location = /api/v1/otentikasi {
        limit_req zone=login_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Rate Limit: REST API ──────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Static Assets: Cache Browser ─────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Favicon & Robots (tanpa log) ─────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── PHP-FPM Handler ───────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 32k;
    }

    # ── Blokir akses ke file tersembunyi (.env, .git, dll.) ──
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # ── Blokir akses langsung ke storage ─────────────────────
    location ~* ^/storage/ {
        deny all;
        return 404;
    }

    error_page 404 /index.php;

    # ── Access & Error Logs ───────────────────────────────────
    access_log /var/log/nginx/sso-access.log;
    error_log  /var/log/nginx/sso-error.log;
}

